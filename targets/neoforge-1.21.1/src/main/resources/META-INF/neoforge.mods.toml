modLoader = "javafml"
loaderVersion = "${fml_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"
logoFile = "assets/superbwarfare_boarding/icon.png"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "interactive_animation"
type = "required"
versionRange = "[0.1.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "superbwarfare"
type = "required"
versionRange = "[0.8.9.2,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "superbwarfare_boarding.mixins.json"
